name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages is static-only: it cannot run server code, so the
      # waitlist form posts straight to the Dunwell service and the service
      # allows this origin via DUNWELL_CORS_ORIGINS.
      #
      # Stage an explicit whitelist of public files. Uploading the repository
      # root would publish server.py and data/waitlist.csv - the second one
      # holds customer email addresses.
      - name: Stage the public site
        run: |
          mkdir -p _site
          for f in index.html styles.css privacy.html terms.html favicon.ico config.js; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            fi
          done

          # Write config.js from repository variables so the static page knows
          # where to post and which demo video to show. Set both under:
          #   Settings > Secrets and variables > Actions > Variables
          #
          #   DUNWELL_API_URL   e.g. https://app.dunwell.app
          #   DUNWELL_DEMO_URL  a YouTube/Vimeo link, or a direct .mp4
          API_URL="${{ vars.DUNWELL_API_URL }}"
          DEMO_URL="${{ vars.DUNWELL_DEMO_URL }}"
          API_URL="${API_URL%/}"

          {
            echo "// Generated at deploy time. Edits here are overwritten."
            if [ -n "$API_URL" ]; then
              printf 'window.DUNWELL_API_URL = "%s";\n' "$API_URL"
            else
              echo 'window.DUNWELL_API_URL = "";'
            fi
            if [ -n "$DEMO_URL" ]; then
              printf 'window.DUNWELL_DEMO_URL = "%s";\n' "$DEMO_URL"
            else
              echo 'window.DUNWELL_DEMO_URL = "";'
            fi
          } > _site/config.js

          if [ -n "$API_URL" ]; then
            echo "Waitlist API: $API_URL"
          else
            echo "::warning::DUNWELL_API_URL is not set - the form will report that the waitlist is not connected."
          fi

          if [ -n "$DEMO_URL" ]; then
            echo "Demo video: $DEMO_URL"
          else
            echo "DUNWELL_DEMO_URL is not set - the demo button stays hidden."
          fi

          ls -la _site
          # Guard: nothing outside the whitelist may reach the artifact.
          if [ -e _site/server.py ] || [ -d _site/data ] || [ -d _site/functions ]; then
            echo "Refusing to publish: private files are present in _site"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
