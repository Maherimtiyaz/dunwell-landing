name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # server.py is standard library only: no runtime dependencies to install.
      - name: Byte-compile the server
        run: python -m compileall -q server.py

      - name: Server starts and answers
        run: |
          python server.py --port 8905 &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8905/ | grep -q "<title>Dunwell"
          curl -fsS http://127.0.0.1:8905/styles.css | grep -q "body"
          # The waitlist count must be a JSON object with ok:true.
          curl -fsS http://127.0.0.1:8905/api/waitlist/count \
            | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          kill $SERVER_PID

      - name: Demo slot is wired
        # The lightbox script returns early when any of these elements is
        # missing, so a refactor could delete the markup and nothing would
        # fail until someone set DUNWELL_DEMO_URL and saw no button.
        run: |
          grep -q 'id="demo-cta"' index.html
          grep -q 'id="demo-modal"' index.html
          grep -q 'id="demo-modal-body"' index.html
          grep -q 'DUNWELL_DEMO_URL' config.js
          # Hidden by default: the button is revealed by JS only once a video
          # URL exists, so the page never advertises a demo that does not.
          grep -q 'demo-cta" id="demo-cta" hidden' index.html

      - name: Error shape matches the Dunwell service contract
        # The page is served either by this server or by the Dunwell service.
        # Both must answer with error as an object, or the form renders
        # "[object Object]" when it is hosted by the service.
        #
        # No curl -f here: an invalid email answers 422 by design, and -f
        # would treat that intended status as a transport failure.
        run: |
          python server.py --port 8907 &
          SERVER_PID=$!
          sleep 2
          body=$(curl -sS -X POST http://127.0.0.1:8907/api/waitlist \
            -H "Content-Type: application/json" \
            -d '{"email":"nope"}')
          echo "response: $body"
          echo "$body" | grep -Eq '"error"[[:space:]]*:[[:space:]]*\{'
          echo "$body" | grep -Eq '"code"[[:space:]]*:[[:space:]]*"invalid_email"'
          kill $SERVER_PID

      - name: Private files are not served
        run: |
          python server.py --port 8906 &
          SERVER_PID=$!
          sleep 2
          # server.py and the waitlist CSV must never be reachable over HTTP.
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8906/server.py)
          test "$status" = "404"
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8906/data/waitlist.csv)
          test "$status" = "404"
          kill $SERVER_PID
